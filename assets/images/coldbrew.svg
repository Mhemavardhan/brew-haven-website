  <rect width="200" height="200" rx="20" fill="#2A1B14"/>
  <ellipse cx="100" cy="170" rx="45" ry="10" fill="#1A110C"/>
  <path d="M70 50 L75 165 C75 168 85 172 100 172 C115 172 125 168 125 165 L130 50 Z" fill="#6A381F" stroke="#E8D8C8" stroke-width="2"/>
  <ellipse cx="100" cy="50" rx="30" ry="8" fill="#FAF6EE" stroke="#E8D8C8" stroke-width="2"/>
