  <ellipse cx="250" cy="310" rx="85" ry="16" fill="#3D2314" opacity="0.2"/>
  <!-- Cup Body -->
  <path d="M160 170 C160 290 190 310 250 310 C310 310 340 290 340 170 Z" fill="url(#cupGrad)" stroke="#B7976B" stroke-width="3"/>
  <!-- Cup Rim -->
  <ellipse cx="250" cy="170" rx="90" ry="22" fill="#FAEDCD" stroke="#B7976B" stroke-width="3"/>
  <!-- Coffee Surface -->
  <ellipse cx="250" cy="174" rx="80" ry="18" fill="url(#coffeeGrad)"/>
