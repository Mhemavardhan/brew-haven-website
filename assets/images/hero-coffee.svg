  <path d="M250 162 C235 168 230 182 250 188 C270 182 265 168 250 162 Z" fill="#FAEDCD" opacity="0.85"/>
  <circle cx="250" cy="165" r="3" fill="#D4A373"/>
  <!-- Handle -->
  <path d="M335 190 C380 190 385 260 330 270" fill="none" stroke="#D4A373" stroke-width="14" stroke-linecap="round"/>
  <path d="M335 190 C380 190 385 260 330 270" fill="none" stroke="#FAEDCD" stroke-width="8" stroke-linecap="round"/>
  <!-- Steam Curves -->
  <path d="M220 140 C210 110 230 90 220 60" stroke="#D4A373" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M250 135 C240 100 260 80 250 45" stroke="#D4A373" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M280 140 C270 110 290 90 280 60" stroke="#D4A373" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Decorative Star Accents -->
  <path d="M120 100 L124 110 L134 114 L124 118 L120 128 L116 118 L106 114 L116 110 Z" fill="#D4A373" opacity="0.7"/>
  <path d="M380 110 L383 118 L391 121 L383 124 L380 132 L377 124 L369 121 L377 118 Z" fill="#D4A373" opacity="0.6"/>
