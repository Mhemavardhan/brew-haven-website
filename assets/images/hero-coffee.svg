<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <radialGradient id="steamGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4A373" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAEDCD"/>
      <stop offset="100%" stop-color="#CCD5AE"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2C1A"/>
      <stop offset="100%" stop-color="#2B1408"/>
    </linearGradient>
  </defs>
  <!-- Saucer -->
  <ellipse cx="250" cy="330" rx="160" ry="30" fill="#D4A373" opacity="0.3"/>
  <ellipse cx="250" cy="325" rx="145" ry="24" fill="#E9D8A6"/>
  <ellipse cx="250" cy="323" rx="100" ry="16" fill="#D4A373"/>
